<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>하루성경</title>
<meta name="description" content="성경전서 개역한글판 전권을 담은 오프라인 성경 앱">
<style>:root {
  --bg: #ffffff; --surface: #faf9f8; --text: #1c1917; --muted: #57534e;
  --line: #e7e5e4; --accent: #733124;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17120f; --surface: #211a16; --text: #f5f5f4; --muted: #a8a29e;
    --line: #3a2f28; --accent: #d99a86;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0 20px 80px;
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard",
    "Malgun Gothic", system-ui, sans-serif;
  line-height: 1.75; word-break: keep-all; overflow-wrap: break-word;
}
.wrap { max-width: 720px; margin: 0 auto; }
header { padding: 56px 0 32px; border-bottom: 1px solid var(--line); margin-bottom: 40px; }
.brand {
  display: inline-block; font-size: 14px; font-weight: 700; letter-spacing: .02em;
  color: var(--accent); text-decoration: none; margin-bottom: 18px;
}
h1 { font-size: clamp(28px, 6vw, 38px); line-height: 1.3; margin: 0 0 16px; letter-spacing: -.02em; }
.summary { color: var(--muted); font-size: 16px; margin: 0; }
h2 { font-size: 19px; margin: 40px 0 12px; letter-spacing: -.01em; }
p { margin: 0 0 14px; color: var(--muted); }
ul { margin: 0 0 14px; padding-left: 22px; color: var(--muted); }
li { margin-bottom: 6px; }
a { color: var(--accent); }
footer {
  margin-top: 56px; padding-top: 24px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: 14px;
}
footer a { margin-right: 16px; }</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>하루성경</h1>
      <p class="summary">성경전서 개역한글판 66권 전체가 앱 안에 들어 있습니다.
      인터넷 없이 읽고, 밑줄을 긋고, 묵상을 남기세요. 계정도 광고도 없습니다.</p>
    </header>
    <main>
      <h2>문서</h2>
      <ul>
        <li><a href="./privacy/">개인정보처리방침</a></li>
        <li><a href="./terms/">이용약관</a></li>
      </ul>
      <h2>문의</h2>
      <p><a href="mailto:reu0691@kakao.com">reu0691@kakao.com</a></p>
    </main>
    <footer>
      <p>성경전서 개역한글판의 저작권은 대한성서공회에 있습니다.</p>
    </footer>
  </div>
</body>
</html>
